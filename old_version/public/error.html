<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Balela Trunfo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #05020a;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-container {
            padding: 40px;
            max-width: 500px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7b2fbe, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
        }
        h1 { font-size: 1.5rem; margin-top: 20px; }
        p { color: #888; margin-bottom: 30px; line-height: 1.6; }
        .btn-back {
            background: #7b2fbe;
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            transition: 0.3s;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(123, 47, 190, 0.3);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 47, 190, 0.5);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h1>Ops! Você se perdeu no deck?</h1>
        <p>A página que você está procurando não existe ou você não tem permissão para acessá-la no momento.</p>
        <a href="/" class="btn-back">Voltar para a Home</a>
    </div>
</body>
</html>
