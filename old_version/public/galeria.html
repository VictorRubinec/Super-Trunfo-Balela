<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria de Gravações — Balela Trunfo</title>
  <meta name="description" content="Fotos exclusivas das gravações do canal Balela" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  
  <style>
    .gallery-hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(180deg, rgba(123, 47, 190, 0.1) 0%, rgba(11, 6, 24, 0) 100%);
      border-radius: 24px;
      margin-bottom: 40px;
    }

    .gallery-hero h1 {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(90deg, #fff 0%, #7b2fbe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 80px;
    }

    .photo-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }

    .photo-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(123, 47, 190, 0.3);
      border-color: var(--primary-light);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .photo-card:hover img {
      transform: scale(1.1);
    }

    .photo-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(0deg, rgba(11, 6, 24, 0.9) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .photo-card:hover .photo-info {
      opacity: 1;
    }

    .photo-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 6, 24, 0.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 80vh; /* Reduzi um pouco para caber o rodapé */
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }

    .lightbox-footer {
      padding: 20px 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .author-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--primary);
    }

    .author-info p { margin: 0; font-size: 0.9rem; }
    .author-label { font-size: 0.7rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; }

    /* Filtros */
    .gallery-filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .filter-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      background: rgba(123, 47, 190, 0.1);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(123, 47, 190, 0.5);
    }

    /* Estilo de Álbum (Pilha de Fotos) */
    .album-card {
      position: relative;
      width: 320px; /* Aumentado para o formato 16:9 */
      aspect-ratio: 16 / 9;
      margin: 40px auto 80px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .album-card:hover {
      transform: scale(1.05);
    }

    .album-photo {
      position: absolute;
      border-radius: 6px;
      background: var(--glass-bg);
      border: 2px solid #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      object-fit: cover;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* Foto Principal (Capa) */
    .album-photo.p1 {
      width: 100%;
      height: 100%;
      z-index: 10;
      border-width: 3px;
      transform: translateY(0);
    }

    /* Miniaturas (Quadradas) */
    .album-photo:not(.p1) {
      width: 100px;
      height: 100px;
      top: 0;
      left: 50%;
      margin-left: -50px;
      z-index: 1;
      opacity: 0.8;
    }

    /* Posições Iniciais (Espreitando pelo topo para ficarem aparentes) */
    .album-photo.p2 { transform: translate(-90px, -25px) rotate(-10deg); z-index: 5; }
    .album-photo.p3 { transform: translate(-45px, -35px) rotate(-5deg); z-index: 4; }
    .album-photo.p4 { transform: translate(0, -40px) rotate(0deg); z-index: 3; }
    .album-photo.p5 { transform: translate(45px, -35px) rotate(5deg); z-index: 2; }
    .album-photo.p6 { transform: translate(90px, -25px) rotate(10deg); z-index: 1; }

    /* Animação Hover (Sobe e abre mais o leque) */
    .album-card:hover .album-photo.p2 { transform: translate(-120px, -60px) rotate(-20deg); opacity: 1; }
    .album-card:hover .album-photo.p3 { transform: translate(-60px, -85px) rotate(-10deg); opacity: 1; }
    .album-card:hover .album-photo.p4 { transform: translate(0, -95px) rotate(0deg); opacity: 1; }
    .album-card:hover .album-photo.p5 { transform: translate(60px, -85px) rotate(10deg); opacity: 1; }
    .album-card:hover .album-photo.p6 { transform: translate(120px, -60px) rotate(20deg); opacity: 1; }

    .album-title {
      position: absolute;
      bottom: -45px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* View Toggles */
    .view-toggles {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 80px; /* Aumentado para dar espaço às fotos que sobem */
      border: none;
      background: none;
      position: relative;
      z-index: 100; /* Garante que fique acima das fotos */
    }

    .view-toggle-btn {
      background: none;
      border: none;
      color: var(--text-3);
      padding: 10px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      opacity: 0.6;
    }

    .view-toggle-btn:hover {
      opacity: 1;
      color: #fff;
    }

    .view-toggle-btn.active {
      opacity: 1;
      color: var(--primary-light);
      position: relative;
    }

    .view-toggle-btn.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      border-radius: 2px;
    }

    /* Back Button & Path */
    .gallery-path {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .btn-back-albums {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .btn-back-albums:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--primary);
    }

    .current-path-name {
      color: var(--primary-light);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .lightbox-close {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* Loading State */
    .loading-spinner {
      grid-column: 1 / -1;
      text-align: center;
      padding: 100px 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(123, 47, 190, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, var(--glass-bg) 25%, rgba(123, 47, 190, 0.1) 50%, var(--glass-bg) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="app-header">
    <!-- Renderizado via Navbar.js -->
  </header>

  <main class="gallery-container">
    <section class="gallery-hero">
      <h1 id="gallery-title">Galeria Balela</h1>
      <p id="gallery-subtitle">Bastidores e momentos exclusivos das gravações</p>
    </section>

    <div class="view-toggles">
      <button class="view-toggle-btn active" data-view="general">
        <i data-lucide="layout-grid"></i> Geral
      </button>
      <button class="view-toggle-btn" data-view="folders">
        <i data-lucide="folder"></i> Álbuns
      </button>
    </div>

    <div class="gallery-filters hidden" id="gallery-filters">
      <div class="gallery-path">
        <button class="btn-back-albums" id="btn-back-albums">
          <i data-lucide="arrow-left"></i> Álbuns
        </button>
        <span class="path-divider" style="opacity: 0.3;">/</span>
        <span class="current-path-name" id="current-folder-name">Nome da Pasta</span>
      </div>
    </div>

    <div class="photo-grid" id="photo-grid">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Acessando o Drive...</p>
      </div>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close">✕</button>
      <img src="" alt="Ampliada" class="lightbox-img" id="lightbox-img" />
      <div class="lightbox-footer" id="lightbox-footer">
        <img src="" alt="Autor" class="author-img" id="author-img" />
        <div class="author-info">
          <p class="author-label">Enviado por</p>
          <p id="author-name">Carregando...</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-inner">
      <span>Season Pass Balela © 2026 · Victor Zanin Rubinec</span>
    </div>
  </footer>

  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
